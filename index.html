<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Композиція у стилі Мондріана</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="frame">
    <table class="mondrian">
      <colgroup>
        <col class="col-1">
        <col class="col-2">
        <col class="col-3">
        <col class="col-4">
        <col class="col-5">
      </colgroup>
      <tbody>
        <tr>
          <td class="h70"></td>
          <td class="h70"></td>
          <td class="h70"></td>
          <td class="yellow h70" colspan="2"></td>
        </tr>

        <tr>
          <td class="h160" rowspan="2"></td>
          <td class="red h300" colspan="3" rowspan="2"></td>
          <td class="yellow h160"></td>
        </tr>

        <tr>
          <td class="h160"></td>
        </tr>

        <tr>
          <td class="h120" rowspan="2"></td>
          <td class="black h190" colspan="2" rowspan="2"></td>
          <td class="h120"></td>
          <td class="h120"></td>
        </tr>

        <tr>
          <td class="h120"></td>
          <td class="blue h120"></td>
        </tr>

        <tr>
          <td colspan="4"></td>
          <td class="red h70"></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
